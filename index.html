<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Adhikara - Executive Demo</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        navy: { 900: '#0B1120', 800: '#141D2F', 700: '#1E293B', hover: '#19243C' },
                        gold: { DEFAULT: '#D4AF37', light: '#FDE047', dark: '#B49020' },
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F3F4F6;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .mobile-container {
            width: 375px;
            height: 750px;
            border: 12px solid #111;
            border-radius: 2.5rem;
            position: relative;
            background-color: #f9fafb;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
        }

        .mobile-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 24px;
            background-color: #111;
            border-bottom-left-radius: 1rem;
            border-bottom-right-radius: 1rem;
            z-index: 50;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="h-screen overflow-hidden text-gray-800 antialiased flex flex-col">

    <div id="app" class="h-full w-full flex relative"></div>

    <script>
        const state = {
            role: 'Super Admin',
            menu: 'Dashboard',
            dropdownOpen: false,
            sidebarOpen: false, // State untuk toggle responsive sidebar di mobile

            // Business Flow States
            liveAttendance: [],
            isPayrollPublished: false,
            clientOvertimeRequests: [
                { id: 'OV-01', name: 'Hairul Bahri', shift: 'Lembur Malam (2 Jam)', date: '04 Okt 2026', status: 'Menunggu Persetujuan Klien' },
                { id: 'OV-02', name: 'Budi Santoso', shift: 'Lembur Weekend (4 Jam)', date: '03 Okt 2026', status: 'Disetujui Klien' }
            ],
            clientInvoices: [
                { no: 'INV-2610-001', period: 'Oktober 2026', total: 145500000, status: 'Belum Lunas', due: '25 Okt 2026' },
                { no: 'INV-2609-042', period: 'September 2026', total: 142000000, status: 'Lunas', due: '25 Sep 2026' }
            ],

            // PWA States
            pwaTab: 'Beranda',
            pwaPinUnlocked: false,
            pwaPinError: false,

            // Core Dummy Data Reference
            mainEmployee: {
                name: 'Hairul Bahri',
                email: 'hairulb876@gmail.com',
                client: 'PT Bank Mandiri (Persero) Tbk',
                location: 'Menara Mandiri, Jakarta Selatan',
                position: 'Fullstack Developer / Security Officer',
                gajiBruto: 4500000,
                bpjs: 135000,
                pph21: 20000,
                netto: 4345000
            }
        };

        const menus = {
            'Super Admin': [
                { category: 'HRMS Backoffice', items: ['Dashboard'] },
                { category: 'MASTER KLIEN', items: ['Klien', 'Lokasi klien', 'PKS', 'Tarif jasa PKS'] },
                { category: 'MASTER OPERASIONAL', items: ['Posisi', 'Shift', 'Hari libur'] },
                { category: 'MASTER GAJI & PAJAK', items: ['Komponen gaji', 'Program BPJS', 'Tarif BPJS', 'PTKP', 'Tarif TER PPh21', 'Tarif progresif PPh21', 'Aturan lembur'] },
                { category: 'SISTEM', items: ['Pengaturan', 'Pengguna'] }
            ],
            'HRD': [
                { category: 'OPERASIONAL', items: ['Dashboard', 'Karyawan', 'Penempatan', 'Jadwal kerja', 'Absensi', 'Pengajuan & Cuti'] },
                { category: 'REKRUTMEN', items: ['Permintaan TK', 'Kandidat'] }
            ],
            'Finance': [
                { category: 'FINANSIAL', items: ['Dashboard', 'Penggajian', 'Penyesuaian Gaji', 'Penagihan', 'Pembayaran', 'Laporan'] }
            ],
            'Klien': [
                { category: 'PORTAL KLIEN', items: ['Dashboard', 'Pekerja Aktif', 'Kehadiran', 'Persetujuan Lembur', 'Tagihan'] }
            ]
        };

        const icons = {
            'Dashboard': 'fa-chart-pie', 'Klien': 'fa-building', 'Lokasi klien': 'fa-map-location-dot', 'PKS': 'fa-file-contract',
            'Tarif jasa PKS': 'fa-money-bill-wave', 'Posisi': 'fa-id-badge', 'Shift': 'fa-clock', 'Hari libur': 'fa-calendar-day',
            'Komponen gaji': 'fa-list-ul', 'Program BPJS': 'fa-shield-heart', 'Tarif BPJS': 'fa-percent', 'PTKP': 'fa-users-rays',
            'Tarif TER PPh21': 'fa-file-invoice', 'Tarif progresif PPh21': 'fa-arrow-trend-up', 'Aturan lembur': 'fa-business-time',
            'Pengaturan': 'fa-gear', 'Pengguna': 'fa-users', 'Karyawan': 'fa-user-tie', 'Penempatan': 'fa-street-view',
            'Jadwal kerja': 'fa-calendar-alt', 'Absensi': 'fa-fingerprint', 'Pengajuan & Cuti': 'fa-envelope-open-text',
            'Permintaan TK': 'fa-user-plus', 'Kandidat': 'fa-users-viewfinder', 'Penggajian': 'fa-file-invoice-dollar',
            'Penyesuaian Gaji': 'fa-scale-balanced', 'Penagihan': 'fa-file-signature', 'Pembayaran': 'fa-money-check-dollar',
            'Laporan': 'fa-chart-line', 'Pekerja Aktif': 'fa-users-gear', 'Kehadiran': 'fa-clipboard-user', 'Persetujuan Lembur': 'fa-user-clock', 'Tagihan': 'fa-receipt'
        };

        function getTableDataForMenu(menu) {
            const dataMap = {
                'Klien': { cols: ['ID', 'Nama Klien Korporat', 'Bidang Industri', 'PIC & Kontak', 'Status'], rows: [['KLN-001', 'PT Bank Mandiri (Persero) Tbk', 'Perbankan & Keuangan', 'Bpk. Rian Utama (021-52991000)', 'Aktif'], ['KLN-002', 'PT Telkom Indonesia (Persero) Tbk', 'Telekomunikasi', 'Ibu Siska Melati (021-4521888)', 'Aktif']] },
                'Lokasi klien': { cols: ['Klien', 'Nama Lokasi / Gedung', 'Radius Geofence', 'Status'], rows: [['PT Bank Mandiri', 'Menara Mandiri, Jl. Jend. Sudirman Kav. 54-55', '100m', 'Aktif'], ['PT Telkom', 'Telkom Landmark Tower, Gatot Subroto', '100m', 'Aktif']] },
                'PKS': { cols: ['Klien', 'No Kontrak PKS', 'Tanggal Mulai', 'Termin Bayar', 'Status'], rows: [['PT Bank Mandiri', 'PKS/BM/2026/01', '01 Jan 2026', '14 Hari', 'Aktif']] },
                'Karyawan': { cols: ['NIK', 'Nama Lengkap', 'Email', 'Penempatan Klien', 'Status'], rows: [['35120512...', state.mainEmployee.name, state.mainEmployee.email, state.mainEmployee.client, 'Aktif'], ['35120520...', 'Budi Santoso', 'budi@gmail.com', 'PT Telkom Indonesia', 'Aktif']] },
                'Pengguna': { cols: ['Nama Pengguna', 'Email', 'Peran (Role)', 'Status'], rows: [['Super Admin', 'admin@adhikara.co.id', 'Super Admin', 'Aktif'], [state.mainEmployee.name, state.mainEmployee.email, 'Karyawan', 'Aktif'], ['Bpk. Rian Utama', 'rian@mandiri.co.id', 'Klien', 'Aktif']] },
            };
            if (!dataMap[menu]) {
                return {
                    cols: ['ID Referensi', 'Keterangan Parameter ' + menu, 'Update Terakhir', 'Status'],
                    rows: [
                        ['REF-101', 'Konfigurasi standar ' + menu + ' utama', '05 Okt 2026', 'Aktif'],
                        ['REF-102', 'Konfigurasi tambahan ' + menu + ' cabang', '05 Okt 2026', 'Aktif']
                    ]
                }
            }
            return dataMap[menu];
        }

        function setRole(role) {
            state.role = role;
            state.dropdownOpen = false;
            state.sidebarOpen = false;
            if (role === 'Super Admin') state.menu = 'Dashboard';
            if (role === 'HRD') state.menu = 'Absensi';
            if (role === 'Finance') state.menu = 'Penggajian';
            if (role === 'Klien') state.menu = 'Dashboard';
            if (role === 'Karyawan PWA') state.pwaTab = 'Beranda';
            render();
        }

        function setMenu(menu) {
            state.menu = menu;
            state.sidebarOpen = false; // Tutup sidebar otomatis di mobile setelah diklik
            render();
        }

        function toggleDropdown() {
            state.dropdownOpen = !state.dropdownOpen;
            render();
        }

        function toggleSidebar() {
            state.sidebarOpen = !state.sidebarOpen;
            render();
        }

        function formatRp(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // Business Actions
        function pwaAbsenMasuk() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            state.liveAttendance.push({
                name: state.mainEmployee.name,
                client: state.mainEmployee.client,
                time: timeStr + ' WIB',
                status: 'Hadir (Dalam Geofence)',
                location: state.mainEmployee.location
            });
            alert('Absen Masuk Berhasil! Data GPS & Selfie telah dicatat dan tersinkronisasi ke HRD & Portal Klien.');
            render();
        }

        function financePublishPayroll() {
            if (confirm('Kalkulasi Gaji Massal untuk periode Oktober 2026?\nData akan dikunci dan Slip diterbitkan ke aplikasi karyawan.')) {
                state.isPayrollPublished = true;
                alert('Berhasil! Slip gaji telah dipublikasikan.');
                render();
            }
        }

        function clientApproveOvertime(id) {
            const req = state.clientOvertimeRequests.find(r => r.id === id);
            if (req) {
                req.status = 'Disetujui Klien';
                alert(`Pengajuan lembur ${req.name} berhasil disetujui! Dilanjutkan ke persetujuan HRD.`);
                render();
            }
        }

        function clientPayInvoice(no) {
            const inv = state.clientInvoices.find(i => i.no === no);
            if (inv) {
                inv.status = 'Lunas';
                alert(`Invoice ${no} berhasil dikonfirmasi pembayarannya oleh Klien! Diverifikasi oleh Finance Adhikara.`);
                render();
            }
        }

        function pwaVerifyPin() {
            const pin = document.getElementById('pin-input').value;
            if (pin === '123456') {
                state.pwaPinUnlocked = true;
                state.pwaPinError = false;
            } else {
                state.pwaPinError = true;
            }
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (state.role === 'Karyawan PWA') {
                app.innerHTML = renderPWA();
            } else {
                app.innerHTML = renderBackoffice();
            }
        }

        function renderHeader() {
            return `
                <header class="bg-white h-16 shadow-sm border-b border-gray-100 flex items-center justify-between px-4 sm:px-6 z-20 flex-shrink-0">
                    <div class="flex items-center space-x-3">
                        <!-- Hamburger Menu untuk Mobile Responsive Sidebar -->
                        <button onclick="toggleSidebar()" class="lg:hidden text-gray-700 hover:text-navy-900 p-2 rounded-lg focus:outline-none">
                            <i class="fa-solid fa-bars text-lg"></i>
                        </button>
                        <div class="text-gray-500 text-xs sm:text-sm font-medium hidden sm:block">Senin, 5 Oktober 2026 | Asia/Jakarta</div>
                    </div>

                    <div class="flex items-center space-x-3 relative">
                        <button onclick="setRole('Karyawan PWA')" class="bg-navy-900 text-white px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition hover:bg-navy-800 shadow-sm flex items-center">
                            <i class="fa-solid fa-mobile-screen sm:mr-2"></i> <span class="hidden sm:inline">Coba PWA Karyawan</span><span class="sm:hidden">PWA</span>
                        </button>
                        <div class="h-6 w-px bg-gray-200"></div>
                        <div class="relative">
                            <button onclick="toggleDropdown()" class="flex items-center space-x-2 hover:bg-gray-50 p-1.5 rounded-lg transition text-left border border-transparent hover:border-gray-200">
                                <div class="w-8 h-8 rounded-full bg-gold text-navy-900 flex justify-center items-center font-bold text-xs shadow-sm flex-shrink-0">
                                    ${state.role === 'Klien' ? 'BM' : state.role.substring(0, 2).toUpperCase()}
                                </div>
                                <div class="leading-tight pr-1 hidden md:block">
                                    <p class="text-xs sm:text-sm font-bold text-gray-800">${state.role === 'Klien' ? 'Bpk. Rian (Mandiri)' : state.role}</p>
                                    <p class="text-[10px] text-gray-500">Ganti Peran <i class="fa-solid fa-chevron-down ml-0.5"></i></p>
                                </div>
                            </button>
                            ${state.dropdownOpen ? `
                                <div class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-gray-100 z-50 py-1 fade-in">
                                    ${['Super Admin', 'HRD', 'Finance', 'Klien'].map(r => `
                                        <button onclick="setRole('${r}')" class="w-full text-left px-4 py-2 text-sm hover:bg-gray-50 flex items-center ${state.role === r ? 'font-bold text-navy-900 bg-gray-50' : 'text-gray-600'}">
                                            <i class="fa-solid ${r === 'Super Admin' ? 'fa-crown' : r === 'HRD' ? 'fa-users' : r === 'Finance' ? 'fa-calculator' : 'fa-building'} w-6 text-center text-gray-400"></i>
                                            ${r === 'Klien' ? 'Portal Klien (Bank Mandiri)' : r}
                                        </button>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </header>
            `;
        }

        function renderBackoffice() {
            const activeMenus = menus[state.role] || menus['Super Admin'];

            return `
                <!-- Backdrop untuk mobile saat sidebar terbuka -->
                ${state.sidebarOpen ? `<div onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-30 lg:hidden"></div>` : ''}

                <!-- Responsive Sidebar -->
                <div class="fixed lg:static inset-y-0 left-0 transform ${state.sidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 transition-transform duration-300 ease-in-out w-64 bg-navy-900 text-gray-300 flex flex-col flex-shrink-0 shadow-2xl lg:shadow-xl z-40">
                    <div class="h-20 flex items-center justify-between bg-white m-3 rounded-lg shadow-sm px-4">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-dove text-gold text-2xl"></i>
                            <div>
                                <h1 class="text-navy-900 font-bold text-[14px] tracking-wide leading-tight">ADHIKARA</h1>
                                <p class="text-gold text-[9px] uppercase tracking-widest font-bold leading-tight">Talenta Bangsa</p>
                            </div>
                        </div>
                        <!-- Tombol close sidebar khusus mobile -->
                        <button onclick="toggleSidebar()" class="lg:hidden text-gray-500 hover:text-navy-900">
                            <i class="fa-solid fa-xmark text-lg"></i>
                        </button>
                    </div>
                    <div class="flex-1 overflow-y-auto overflow-x-hidden custom-scrollbar pb-6 mt-2">
                        ${activeMenus.map(group => `
                            <div class="px-6 mt-5 mb-2">
                                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">${group.category}</p>
                            </div>
                            <ul class="space-y-0.5">
                                ${group.items.map(item => `
                                    <li>
                                        <button onclick="setMenu('${item}')" class="w-full flex items-center px-6 py-2.5 text-[13px] font-medium transition-colors ${state.menu === item ? 'bg-navy-hover text-white border-l-2 border-gold shadow-inner' : 'text-gray-400 hover:text-white hover:bg-navy-hover/50 border-l-2 border-transparent'}">
                                            <i class="fa-solid ${icons[item] || 'fa-circle-dot'} w-5 mr-2 opacity-70"></i>
                                            ${item}
                                        </button>
                                    </li>
                                `).join('')}
                            </ul>
                        `).join('')}
                    </div>
                </div>

                <!-- Main Content Wrapper -->
                <div class="flex-1 flex flex-col overflow-hidden w-full relative bg-gray-50">
                    ${renderHeader()}
                    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 fade-in">
                        ${renderMainContent()}
                    </main>
                </div>
            `;
        }

        function renderMainContent() {
            // PORTAL KLIEN REAL-WORLD FOCUSED
            if (state.role === 'Klien') {
                if (state.menu === 'Dashboard' || state.menu === 'Pekerja Aktif') {
                    return `
                        <div class="max-w-6xl mx-auto space-y-6 fade-in">
                            <div class="bg-gradient-to-r from-navy-900 to-navy-700 rounded-2xl p-6 sm:p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <span class="bg-gold text-navy-900 text-[10px] font-bold px-2.5 py-1 rounded uppercase tracking-wider">Klien Korporat VIP</span>
                                    <h2 class="text-2xl sm:text-3xl font-bold mt-2">PT Bank Mandiri (Persero) Tbk</h2>
                                    <p class="text-gray-300 text-xs sm:text-sm mt-1">Menara Mandiri, Jl. Jend. Sudirman Kav. 54-55, Jakarta Selatan</p>
                                </div>
                                <div class="bg-white/10 backdrop-blur px-5 py-3 rounded-xl border border-white/10 w-full md:w-auto text-left md:text-right">
                                    <p class="text-xs text-gold font-bold">Total Tenaga Alih Daya</p>
                                    <p class="text-2xl font-extrabold">84 Orang</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6">
                                <div class="bg-white p-5 sm:p-6 rounded-xl shadow-sm border border-gray-100">
                                    <p class="text-xs text-gray-400 font-bold uppercase">Kehadiran Hari Ini</p>
                                    <h3 class="text-2xl font-bold text-navy-900 mt-1">98.8% <span class="text-xs text-green-600 font-normal">(83/84 Hadir)</span></h3>
                                </div>
                                <div class="bg-white p-5 sm:p-6 rounded-xl shadow-sm border border-gray-100">
                                    <p class="text-xs text-gray-400 font-bold uppercase">Persetujuan Lembur</p>
                                    <h3 class="text-2xl font-bold text-orange-500 mt-1">1 Pending</h3>
                                </div>
                                <div class="bg-white p-5 sm:p-6 rounded-xl shadow-sm border border-gray-100">
                                    <p class="text-xs text-gray-400 font-bold uppercase">Tagihan Bulan Ini</p>
                                    <h3 class="text-2xl font-bold text-navy-900 mt-1">Rp 145.5 Juta</h3>
                                </div>
                            </div>

                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                                <div class="p-5 border-b border-gray-100 flex justify-between items-center">
                                    <h3 class="font-bold text-gray-800 text-sm sm:text-base">Daftar Tenaga Alih Daya Penempatan Aktif</h3>
                                    <span class="text-xs text-gray-500 hidden sm:inline">Satpam & Cleaning Service</span>
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left text-sm min-w-[500px]">
                                        <thead class="bg-gray-50 text-gray-600 font-semibold border-b">
                                            <tr><th class="px-6 py-3">Nama Pekerja</th><th class="px-6 py-3">Posisi</th><th class="px-6 py-3">Lokasi Penempatan</th><th class="px-6 py-3">Status Absen Hari Ini</th></tr>
                                        </thead>
                                        <tbody class="divide-y divide-gray-100">
                                            <tr class="hover:bg-gray-50">
                                                <td class="px-6 py-3 font-bold text-navy-900">Hairul Bahri</td>
                                                <td class="px-6 py-3">Security Officer / Dev</td>
                                                <td class="px-6 py-3">KC Situbondo / Menara Mandiri</td>
                                                <td class="px-6 py-3"><span class="bg-green-100 text-green-700 text-xs px-2.5 py-1 rounded-full font-bold">Hadir (07:52 WIB)</span></td>
                                            </tr>
                                            <tr class="hover:bg-gray-50">
                                                <td class="px-6 py-3 font-bold text-navy-900">Budi Santoso</td>
                                                <td class="px-6 py-3">Senior Security</td>
                                                <td class="px-6 py-3">Menara Mandiri Lt. 12</td>
                                                <td class="px-6 py-3"><span class="bg-green-100 text-green-700 text-xs px-2.5 py-1 rounded-full font-bold">Hadir (07:30 WIB)</span></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                }
                if (state.menu === 'Persetujuan Lembur') {
                    return `
                        <div class="max-w-6xl mx-auto space-y-6 fade-in">
                            <div><h2 class="text-xl sm:text-2xl font-bold text-gray-800">Persetujuan Lembur Karyawan</h2><p class="text-xs sm:text-sm text-gray-500">Lembur disetujui oleh Klien terlebih dahulu sebelum diteruskan ke HRD.</p></div>
                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left text-sm min-w-[600px]">
                                        <thead class="bg-gray-50 text-gray-600 font-semibold border-b">
                                            <tr><th class="px-6 py-3">ID Pengajuan</th><th class="px-6 py-3">Nama Karyawan</th><th class="px-6 py-3">Keterangan Shift</th><th class="px-6 py-3">Tanggal</th><th class="px-6 py-3">Status</th><th class="px-6 py-3 text-right">Aksi</th></tr>
                                        </thead>
                                        <tbody class="divide-y divide-gray-100">
                                            ${state.clientOvertimeRequests.map(r => `
                                                <tr class="hover:bg-gray-50">
                                                    <td class="px-6 py-3 font-mono font-bold text-navy-900">${r.id}</td>
                                                    <td class="px-6 py-3 font-bold">${r.name}</td>
                                                    <td class="px-6 py-3">${r.shift}</td>
                                                    <td class="px-6 py-3 text-gray-500">${r.date}</td>
                                                    <td class="px-6 py-3"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${r.status.includes('Disetujui') ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}">${r.status}</span></td>
                                                    <td class="px-6 py-3 text-right">
                                                        ${r.status.includes('Menunggu') ? `<button onclick="clientApproveOvertime('${r.id}')" class="bg-navy-900 hover:bg-navy-800 text-white px-3 py-1.5 rounded text-xs font-bold shadow">Setujui Lembur</button>` : `<span class="text-xs text-green-600 font-bold"><i class="fa-solid fa-check mr-1"></i> Selesai</span>`}
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                }
                if (state.menu === 'Tagihan') {
                    return `
                        <div class="max-w-6xl mx-auto space-y-6 fade-in">
                            <div><h2 class="text-xl sm:text-2xl font-bold text-gray-800">Tagihan & Konfirmasi Pembayaran Invoice</h2><p class="text-xs sm:text-sm text-gray-500">Tagihan dibentuk dari slip gaji terkunci ditambah fee jasa dan iuran BPJS perusahaan.</p></div>
                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left text-sm min-w-[600px]">
                                        <thead class="bg-gray-50 text-gray-600 font-semibold border-b">
                                            <tr><th class="px-6 py-3">No Invoice</th><th class="px-6 py-3">Periode Gaji</th><th class="px-6 py-3">Jatuh Tempo</th><th class="px-6 py-3">Total Tagihan</th><th class="px-6 py-3">Status</th><th class="px-6 py-3 text-right">Aksi Klien</th></tr>
                                        </thead>
                                        <tbody class="divide-y divide-gray-100">
                                            ${state.clientInvoices.map(i => `
                                                <tr class="hover:bg-gray-50">
                                                    <td class="px-6 py-3 font-mono font-bold text-navy-900">${i.no}</td>
                                                    <td class="px-6 py-3">${i.period}</td>
                                                    <td class="px-6 py-3 text-gray-500">${i.due}</td>
                                                    <td class="px-6 py-3 font-bold text-navy-900">${formatRp(i.total)}</td>
                                                    <td class="px-6 py-3"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${i.status === 'Lunas' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${i.status}</span></td>
                                                    <td class="px-6 py-3 text-right">
                                                        ${i.status !== 'Lunas' ? `<button onclick="clientPayInvoice('${i.no}')" class="bg-gold hover:bg-gold-dark text-navy-900 px-3 py-1.5 rounded text-xs font-bold shadow">Konfirmasi Bayar</button>` : `<span class="text-xs text-gray-400 font-medium">Terverifikasi</span>`}
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            // SUPER ADMIN DASHBOARD
            if (state.role === 'Super Admin' && state.menu === 'Dashboard') {
                return `
                    <div class="max-w-6xl mx-auto space-y-6">
                        <div class="bg-navy-800 rounded-2xl p-6 sm:p-8 relative overflow-hidden flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-lg">
                            <div class="relative z-10">
                                <p class="text-gold text-[10px] font-bold tracking-widest uppercase mb-1">DASHBOARD</p>
                                <h2 class="text-2xl sm:text-3xl font-bold text-white mb-2">Selamat pagi, Super</h2>
                                <p class="text-gray-300 text-xs sm:text-sm">Ada 4 hal pada master data yang perlu dilengkapi.</p>
                            </div>
                            <div class="relative z-10 flex space-x-3">
                                <button class="bg-navy-700/80 hover:bg-navy-600 text-gold border border-gold/30 px-3 sm:px-4 py-2 rounded text-xs sm:text-sm font-medium transition"><i class="fa-solid fa-plus mr-1"></i> Klien</button>
                                <button class="bg-navy-700/80 hover:bg-navy-600 text-gold border border-gold/30 px-3 sm:px-4 py-2 rounded text-xs sm:text-sm font-medium transition"><i class="fa-solid fa-plus mr-1"></i> PKS</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4">
                            ${[{ l: 'Klien aktif', v: '3' }, { l: 'Lokasi kerja', v: '5' }, { l: 'PKS aktif', v: '3' }, { l: 'Posisi aktif', v: '4' }, { l: 'Shift aktif', v: '3' }, { l: 'Pengguna', v: '120' }]
                        .map(s => `<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100"><h3 class="text-xl sm:text-2xl font-bold text-navy-900">${s.v}</h3><p class="text-[10px] sm:text-[11px] text-gray-500 font-bold uppercase mt-1">${s.l}</p></div>`).join('')}
                        </div>

                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                                <h3 class="font-bold text-gray-800 text-sm sm:text-base">Kelengkapan Master Data</h3>
                                <span class="bg-orange-100 text-orange-700 text-[10px] sm:text-xs font-bold px-2.5 py-1 rounded-full">4 perlu perhatian</span>
                            </div>
                            <div class="divide-y divide-gray-100">
                                <div class="p-4 flex items-center hover:bg-gray-50"><i class="fa-solid fa-circle-check text-green-500 text-lg w-8"></i><div><p class="text-xs sm:text-sm font-bold">Tarif BPJS berlaku</p><p class="text-[11px] sm:text-xs text-gray-500">5 program telah dikonfigurasi.</p></div></div>
                                <div class="p-4 flex items-center hover:bg-gray-50"><i class="fa-solid fa-circle-exclamation text-orange-500 text-lg w-8"></i><div><p class="text-xs sm:text-sm font-bold">Hari libur 2026</p><p class="text-[11px] sm:text-xs text-gray-500">Belum ada hari libur diset.</p></div></div>
                                <div class="p-4 flex items-center hover:bg-gray-50"><i class="fa-solid fa-circle-check text-green-500 text-lg w-8"></i><div><p class="text-xs sm:text-sm font-bold">Tarif TER PPh21</p><p class="text-[11px] sm:text-xs text-gray-500">Kategori A, B, C terisi.</p></div></div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // HRD - ABSENSI
            if (state.role === 'HRD' && state.menu === 'Absensi') {
                return `
                    <div class="max-w-6xl mx-auto space-y-6">
                        <div><h2 class="text-xl sm:text-2xl font-bold text-gray-800">Monitor Absensi Geofence</h2><p class="text-xs sm:text-sm text-gray-500">Data realtime tersinkronisasi dari PWA Karyawan.</p></div>
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm min-w-[600px]">
                                    <thead class="bg-navy-900 text-white font-semibold">
                                        <tr><th class="px-6 py-4">Karyawan</th><th class="px-6 py-4">Waktu</th><th class="px-6 py-4">Lokasi & Klien</th><th class="px-6 py-4">Status Geofence</th></tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                                        ${state.liveAttendance.map(a => `
                                            <tr class="bg-blue-50/40 hover:bg-blue-50 transition">
                                                <td class="px-6 py-4 font-bold text-gray-800">${a.name}</td>
                                                <td class="px-6 py-4 font-medium text-navy-900">${a.time}</td>
                                                <td class="px-6 py-4 text-gray-600"><i class="fa-solid fa-map-pin text-red-400 mr-1"></i> ${a.location}<br><span class="text-xs">${a.client}</span></td>
                                                <td class="px-6 py-4"><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[11px] font-bold border border-green-200"><i class="fa-solid fa-check mr-1"></i> ${a.status}</span></td>
                                            </tr>
                                        `).join('')}
                                        <tr class="hover:bg-gray-50">
                                            <td class="px-6 py-4 font-bold text-gray-800">Budi Santoso</td><td class="px-6 py-4">07:30 WIB</td><td class="px-6 py-4 text-gray-600"><i class="fa-solid fa-map-pin text-red-400 mr-1"></i> Menara Mandiri<br><span class="text-xs">PT Bank Mandiri (Persero) Tbk</span></td><td class="px-6 py-4"><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[11px] font-bold border border-green-200"><i class="fa-solid fa-check mr-1"></i> Hadir (Dalam Geofence)</span></td>
                                        </tr>
                                        ${state.liveAttendance.length === 0 ? `<tr><td colspan="4" class="px-6 py-8 text-center text-gray-400"><i class="fa-solid fa-mobile-screen mb-2 text-2xl"></i><br>Coba lakukan "Absen Masuk" dari Mode PWA Karyawan untuk melihat data masuk ke sini.</td></tr>` : ''}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            // FINANCE - PENGGAJIAN
            if (state.role === 'Finance' && state.menu === 'Penggajian') {
                return `
                    <div class="max-w-6xl mx-auto space-y-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div><h2 class="text-xl sm:text-2xl font-bold text-gray-800">Siklus Penggajian Okt 2026</h2><p class="text-xs sm:text-sm text-gray-500">Kalkulasi Prorata, BPJS, PPh21 TER otomatis.</p></div>
                            <button onclick="financePublishPayroll()" class="${state.isPayrollPublished ? 'bg-gray-400' : 'bg-navy-900 hover:bg-navy-800 shadow-lg'} text-white px-4 sm:px-5 py-2.5 rounded-lg font-bold text-xs sm:text-sm transition w-full sm:w-auto" ${state.isPayrollPublished ? 'disabled' : ''}>
                                <i class="fa-solid ${state.isPayrollPublished ? 'fa-lock' : 'fa-calculator'} mr-2"></i> ${state.isPayrollPublished ? 'Periode Terkunci & Slip Terbit' : 'Hitung & Publikasi Slip'}
                            </button>
                        </div>
                        
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm min-w-[650px]">
                                    <thead class="bg-gray-50 text-gray-600 font-semibold border-b">
                                        <tr><th class="px-6 py-4">Karyawan</th><th class="px-6 py-4 text-right">Bruto (Gp+Tnj)</th><th class="px-6 py-4 text-right">Pot BPJS</th><th class="px-6 py-4 text-right">Pot PPh21 TER</th><th class="px-6 py-4 text-right text-navy-900 font-bold">Take Home Pay</th></tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                                        <tr class="hover:bg-gray-50">
                                            <td class="px-6 py-4 font-bold text-gray-800">${state.mainEmployee.name}<br><span class="text-xs font-normal text-gray-500">${state.mainEmployee.client}</span></td>
                                            <td class="px-6 py-4 text-right">${formatRp(state.mainEmployee.gajiBruto)}</td>
                                            <td class="px-6 py-4 text-right text-red-500">-${formatRp(state.mainEmployee.bpjs)}</td>
                                            <td class="px-6 py-4 text-right text-red-500">-${formatRp(state.mainEmployee.pph21)}</td>
                                            <td class="px-6 py-4 text-right font-bold text-green-600 text-base">${formatRp(state.mainEmployee.netto)}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            // DEFAULT GENERIC TABLE
            const tableData = getTableDataForMenu(state.menu);
            return `
                <div class="max-w-6xl mx-auto space-y-6 fade-in">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-gray-200 pb-4">
                        <div>
                            <h2 class="text-xl sm:text-2xl font-bold text-gray-800 flex items-center"><i class="fa-solid ${icons[state.menu]} text-gold mr-3"></i> ${state.menu}</h2>
                            <p class="text-xs sm:text-sm text-gray-500 mt-1">Data master dan operasional untuk modul ini.</p>
                        </div>
                        <button class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-xs sm:text-sm font-bold hover:bg-gray-50 shadow-sm"><i class="fa-solid fa-file-export mr-2"></i> Ekspor</button>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm min-w-[500px]">
                                <thead class="bg-gray-50 text-gray-600 font-bold border-b border-gray-200">
                                    <tr>${tableData.cols.map(c => `<th class="px-6 py-4 uppercase tracking-wider text-[11px]">${c}</th>`).join('')}</tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    ${tableData.rows.map(row => `
                                        <tr class="hover:bg-gray-50 transition">
                                            ${row.map((cell, idx) => `<td class="px-6 py-4 ${idx === 0 ? 'font-bold text-navy-900' : ''} ${cell === 'Aktif' ? 'text-green-600 font-bold' : ''}">${cell}</td>`).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPWA() {
            return `
                <div class="h-full w-full bg-gray-900 flex flex-col items-center justify-center relative p-2 sm:p-4">
                    <div class="absolute top-4 sm:top-6 left-4 sm:left-6 text-white z-10 flex space-x-4">
                        <button onclick="setRole('Super Admin')" class="bg-white/10 hover:bg-white/25 backdrop-blur border border-white/20 text-white px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-bold transition flex items-center shadow-lg">
                            <i class="fa-solid fa-arrow-left mr-2"></i> Keluar PWA
                        </button>
                    </div>

                    <div class="mobile-container shadow-2xl">
                        <div class="mobile-notch"></div>
                        
                        <div class="bg-navy-900 pt-12 pb-6 px-6 text-white shrink-0 relative z-10 shadow-md">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-[10px] text-gold font-bold tracking-widest uppercase mb-1">${state.mainEmployee.client}</p>
                                    <h2 class="font-bold text-xl">${state.mainEmployee.name}</h2>
                                    <p class="text-xs text-gray-400 mt-1"><i class="fa-solid fa-id-badge mr-1"></i> ${state.mainEmployee.position}</p>
                                </div>
                                <div class="w-12 h-12 bg-gray-800 rounded-full border-2 border-gold flex items-center justify-center overflow-hidden">
                                    <i class="fa-solid fa-user text-xl text-gray-400"></i>
                                </div>
                            </div>
                        </div>

                        <div class="flex-1 bg-gray-50 overflow-y-auto pb-24 p-5 custom-scrollbar fade-in">
                            ${getPWAContent()}
                        </div>

                        <div class="absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center h-16 pb-1 z-20">
                            ${['Beranda', 'Pengajuan', 'Slip'].map(tab => `
                                <button onclick="state.pwaTab='${tab}'; render()" class="flex flex-col items-center w-full space-y-1 transition ${state.pwaTab === tab ? 'text-navy-900 font-bold' : 'text-gray-400 hover:text-gray-600'}">
                                    <i class="fa-solid ${tab === 'Beranda' ? 'fa-fingerprint' : tab === 'Pengajuan' ? 'fa-file-signature' : 'fa-envelope-open-text'} text-lg${state.pwaTab === tab ? '-mt-1' : ''} transition-all"></i>
                                    <span class="text-[10px]">${tab}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function getPWAContent() {
            if (state.pwaTab === 'Beranda') {
                const hasAbsen = state.liveAttendance.some(a => a.name === state.mainEmployee.name);
                return `
                    <div class="space-y-5">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                            <div><p class="text-xs text-gray-500">Jadwal Hari Ini</p><p class="font-bold text-navy-900 text-sm">Shift Pagi (08:00 - 16:00)</p></div>
                            <div class="bg-blue-50 text-blue-600 w-10 h-10 rounded-full flex items-center justify-center"><i class="fa-solid fa-clock"></i></div>
                        </div>

                        <div class="bg-gray-800 rounded-3xl h-64 relative flex flex-col items-center justify-center overflow-hidden border-4 border-white shadow-md">
                            <div class="absolute inset-0 opacity-30 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
                            <div class="w-16 h-16 bg-blue-500/20 rounded-full animate-ping absolute"></div>
                            <i class="fa-solid fa-location-crosshairs text-4xl text-blue-400 mb-3 relative z-10"></i>
                            <span class="bg-black/60 text-white text-[10px] px-3 py-1.5 rounded-full relative z-10 backdrop-blur"><i class="fa-solid fa-map-pin text-green-400 mr-1"></i> ${state.mainEmployee.location} (Radius: 12m)</span>
                        </div>

                        ${hasAbsen ? `
                            <div class="bg-green-50 border border-green-200 p-4 rounded-2xl text-center shadow-sm fade-in">
                                <i class="fa-solid fa-circle-check text-green-500 text-3xl mb-2"></i>
                                <p class="font-bold text-green-800 text-sm">Berhasil Absen Masuk</p>
                                <p class="text-[11px] text-green-600 mt-1">Tercatat di Server Adhikara</p>
                            </div>
                        ` : `
                            <button onclick="pwaAbsenMasuk()" class="bg-navy-900 hover:bg-navy-800 text-white font-bold py-4 rounded-2xl w-full shadow-lg flex justify-center items-center active:scale-95 transition">
                                <i class="fa-solid fa-fingerprint text-gold mr-2 text-lg"></i> Absen Masuk Sekarang
                            </button>
                        `}
                    </div>
                `;
            }

            if (state.pwaTab === 'Slip') {
                if (!state.pwaPinUnlocked) {
                    return `
                        <div class="flex flex-col items-center justify-center h-full pt-16 text-center px-4 fade-in">
                            <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center text-gray-400 mb-4 shadow-inner"><i class="fa-solid fa-lock text-2xl"></i></div>
                            <h3 class="font-bold text-gray-800 text-lg mb-1">Verifikasi PIN</h3>
                            <p class="text-xs text-gray-500 mb-6 leading-relaxed">Masukkan 6 digit PIN rahasia untuk membuka slip gaji Anda.<br><b class="text-navy-900 mt-1 block">PIN Demo: 123456</b></p>
                            
                            <input type="password" id="pin-input" maxlength="6" class="w-full bg-white border-2 ${state.pwaPinError ? 'border-red-500' : 'border-gray-300'} rounded-xl p-3 text-center tracking-[1em] font-bold text-xl focus:border-navy-900 outline-none transition mb-2 shadow-sm" placeholder="••••••">
                            ${state.pwaPinError ? `<p class="text-[10px] text-red-500 font-bold mb-4">PIN Salah, silakan coba lagi.</p>` : `<div class="mb-4 h-4"></div>`}
                            
                            <button onclick="pwaVerifyPin()" class="bg-navy-900 text-white font-bold py-3.5 rounded-xl w-full shadow active:scale-95 transition">Buka Slip Gaji</button>
                        </div>
                    `;
                }

                if (!state.isPayrollPublished) {
                    return `
                        <div class="flex flex-col items-center justify-center h-full pt-20 text-center px-4 fade-in">
                            <i class="fa-regular fa-folder-open text-5xl text-gray-300 mb-4"></i>
                            <h3 class="font-bold text-gray-800 text-base">Belum Ada Slip Bulan Ini</h3>
                            <p class="text-xs text-gray-500 mt-2">Finance belum menerbitkan slip untuk periode ini. Simulasikan dengan menekan tombol "Hitung & Publikasi" di role Finance.</p>
                        </div>
                    `;
                }

                return `
                    <div class="space-y-4 fade-in">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-navy-900 text-sm">Periode: Oktober 2026</h3>
                            <button onclick="state.pwaPinUnlocked=false; render()" class="bg-red-50 text-red-600 px-2 py-1 rounded text-[10px] font-bold"><i class="fa-solid fa-lock mr-1"></i> Kunci</button>
                        </div>
                        
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                            <div class="text-center border-b border-dashed border-gray-200 pb-4 mb-4">
                                <h4 class="font-bold text-navy-900 text-xs">PT ADHIKARA TALENTA BANGSA</h4>
                                <p class="text-[9px] text-gray-400 uppercase tracking-widest mt-1">Slip Gaji Rahasia</p>
                            </div>
                            
                            <div class="space-y-4 text-xs">
                                <div>
                                    <p class="text-[9px] font-bold text-gray-400 uppercase mb-2">Penerimaan</p>
                                    <div class="flex justify-between border-b border-gray-50 pb-1"><span>Gaji Pokok & Tunj.</span><span class="font-bold text-navy-900">${formatRp(state.mainEmployee.gajiBruto)}</span></div>
                                </div>
                                <div>
                                    <p class="text-[9px] font-bold text-gray-400 uppercase mb-2">Potongan</p>
                                    <div class="flex justify-between border-b border-gray-50 pb-1 mb-1"><span>BPJS Ket. (JHT/JP)</span><span class="text-red-500">-${formatRp(state.mainEmployee.bpjs)}</span></div>
                                    <div class="flex justify-between border-b border-gray-50 pb-1"><span>PPh21 (TER A)</span><span class="text-red-500">-${formatRp(state.mainEmployee.pph21)}</span></div>
                                </div>
                            </div>

                            <div class="mt-6 bg-navy-900 rounded-xl p-4 text-center text-white relative overflow-hidden shadow-md">
                                <div class="absolute -right-4 -top-4 w-16 h-16 rounded-full bg-white/10"></div>
                                <p class="text-[9px] font-bold text-gold uppercase tracking-widest mb-1 relative z-10">Take Home Pay</p>
                                <p class="text-xl font-bold relative z-10">${formatRp(state.mainEmployee.netto)}</p>
                            </div>
                            
                            <button class="w-full mt-4 border border-gray-200 text-gray-600 font-bold py-2 rounded-lg text-xs hover:bg-gray-50 transition"><i class="fa-solid fa-download mr-1"></i> Unduh PDF</button>
                        </div>
                    </div>
                `;
            }

            return `<div class="p-4 text-center text-gray-500 text-xs mt-10">Fitur ${state.pwaTab} sedang dalam pengembangan simulasi.</div>`;
        }

        window.onload = render;
    </script>
</body>

</html>
